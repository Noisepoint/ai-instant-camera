<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Instant Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importing fonts for different aesthetic styles + VT323 for timestamp -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&family=ZCOOL+XiaoWei&family=VT323&display=swap" rel="stylesheet">
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
      }
      
      /* Hide scrollbar for gallery */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Global Cinematic Grain */
      .global-grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        animation: grainShift 2s steps(4) infinite;
      }
      
      @keyframes grainShift {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 2px); }
        50% { transform: translate(2px, -2px); }
        75% { transform: translate(-2px, -2px); }
      }

      /* Paper Texture */
      .paper-texture {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      /* 3D Tilt Container (General) */
      .perspective-container {
        perspective: 1000px;
      }
      .tilt-card {
        transition: transform 0.1s ease-out;
        transform-style: preserve-3d;
      }

      /* --- NEW 3D CAMERA STYLES --- */
      .camera-scene {
        perspective: 1200px;
        width: 100%;
        height: 400px; /* Increased height area */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: visible;
      }
      
      .camera-body {
        position: relative;
        width: 340px; /* Bigger width */
        height: 300px; /* Bigger height */
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
      }
      
      .face {
        position: absolute;
        background: #fdfdfd;
        border: 1px solid rgba(0,0,0,0.05);
        backface-visibility: hidden; /* Optimization */
      }
      
      /* Camera Body Dimensions: W340 x H300 x D80 */
      .face.front {
        width: 340px;
        height: 300px;
        transform: translateZ(40px);
        background: radial-gradient(circle at 50% 120%, #f0f0f0, #ffffff);
        box-shadow: inset 0 0 30px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 20px;
      }
      .face.back {
        width: 340px;
        height: 300px;
        transform: rotateY(180deg) translateZ(40px);
        background: #1a1a1a;
        border-radius: 20px;
      }
      .face.right {
        width: 80px;
        height: 300px;
        transform: rotateY(90deg) translateZ(300px); /* Adjusted for width/2 - depth/2 ? No, translateZ = width/2 - (depth/2)? No. width/2 = 170. depth/2 = 40. 170-40=130? Wait. transform-origin center. */
        /* Let's simplify: translateZ = width / 2 */
        transform: rotateY(90deg) translateZ(170px);
        background: #e0e0e0;
        border-radius: 4px;
      }
      .face.left {
        width: 80px;
        height: 300px;
        transform: rotateY(-90deg) translateZ(170px);
        background: #e0e0e0;
        border-radius: 4px;
      }
      .face.top {
        width: 340px;
        height: 80px;
        transform: rotateX(90deg) translateZ(40px);
        background: #f5f5f5;
        border-radius: 20px 20px 0 0;
      }
      .face.bottom {
        width: 340px;
        height: 80px;
        transform: rotateX(-90deg) translateZ(260px); /* Height - depth/2 = 300 - 40 = 260 */
        background: #d4d4d4;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 0 0 20px 20px;
      }

      /* Camera Details */
      .rainbow-stripe {
        position: absolute;
        bottom: 50px;
        width: 100%;
        height: 40px;
        background: linear-gradient(to right, 
          #ff3b30 14.28%, 
          #ff9500 14.28% 28.56%, 
          #ffcc00 28.56% 42.84%, 
          #4cd964 42.84% 57.12%, 
          #5ac8fa 57.12% 71.4%, 
          #007aff 71.4% 85.68%, 
          #5856d6 85.68%
        );
        opacity: 0.9;
      }

      .lens-housing {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: #1a1a1a;
        margin-top: 30px;
        position: relative;
        transform: translateZ(10px); /* Pop out */
        box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 4px solid #333;
      }
      
      .lens-glass {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.1), rgba(20,20,20,0.9) 60%, #000 100%);
        border: 6px solid #2a2a2a;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 20px #000;
      }
      
      .lens-reflection {
        position: absolute;
        top: 25%;
        left: 25%;
        width: 30px;
        height: 15px;
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        transform: rotate(-45deg);
        filter: blur(2px);
      }
      .lens-reflection-2 {
        position: absolute;
        bottom: 30%;
        right: 30%;
        width: 10px;
        height: 10px;
        background: rgba(100,100,255,0.2);
        border-radius: 50%;
        filter: blur(4px);
      }

      .shutter-btn {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #ff3b30;
        border: 3px solid #cc2d24;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
        cursor: pointer;
        transition: transform 0.1s;
        transform: translateZ(5px);
      }
      .shutter-btn:active {
        transform: translateZ(2px) scale(0.95);
      }

      .flash-unit {
        position: absolute;
        top: 25px;
        left: 25px;
        width: 70px;
        height: 35px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
        border: 2px solid #222;
        box-shadow: inset 0 0 10px #000;
      }
      .flash-bulb {
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(90deg, #555, #555 4px, #444 4px, #444 8px);
        opacity: 0.8;
      }

      .viewfinder-front {
        position: absolute;
        top: 30px;
        right: 40px;
        width: 30px;
        height: 30px;
        background: #111;
        border: 3px solid #333;
        border-radius: 4px;
        box-shadow: inset 0 0 5px #000;
      }

      /* Photo Ejection Animation */
      .photo-slot {
        width: 260px;
        height: 14px;
        background: #050505;
        border-radius: 2px;
        box-shadow: inset 0 1px 3px rgba(255,255,255,0.1);
      }

      .ejecting-photo {
        position: absolute;
        bottom: 5px; 
        left: 50%;
        margin-left: -130px; /* Half of width (260/2) */
        width: 260px;
        height: 300px; /* Long polaroid */
        background: #fff;
        transform-origin: top center;
        /* Start hidden inside */
        transform: translateY(0) translateZ(-10px) rotateX(0deg); 
        transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1);
        z-index: -10; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }
      
      .ejecting-photo.active {
        /* Move down out of the camera */
        transform: translateY(300px) translateZ(-10px) rotateX(0deg); 
      }

      .ejecting-photo-inner {
        width: 220px;
        height: 220px;
        background: #1a1a1a;
      }
      
      /* Camera Body Shadow */
      .camera-shadow {
        position: absolute;
        bottom: -40px;
        width: 300px;
        height: 40px;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
        transform: rotateX(90deg) translateZ(0);
        z-index: -20;
      }
      
      /* Flash Effect Overlay */
      .flash-overlay {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 10000;
        transition: opacity 1s ease-out;
      }
      .flash-overlay.active {
        opacity: 1;
        transition: opacity 0.05s ease-out; /* Instant on */
      }
    </style>
</head>
  <body class="bg-stone-100 text-stone-800 antialiased overflow-x-hidden selection:bg-orange-200">
    <div class="global-grain"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
